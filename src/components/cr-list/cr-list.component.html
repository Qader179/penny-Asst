<section class="cr-list">
	<header class="cr-list__header">
		<h2>Change Requests</h2>
		<label>
			Status
			<select class="cr-list__filter" [value]="statusFilter" (change)="onFilterChange($any($event.target).value)">
				<option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
			</select>
		</label>
	</header>

	<p *ngIf="state.status === 'loading'" class="cr-list__loading" role="status">Loading change requests…</p>

	<div *ngIf="state.status === 'error'" class="cr-list__error" role="alert">
		<p>Couldn't load change requests: {{ state.error }}</p>
		<button type="button" (click)="load()">Retry</button>
	</div>

	<p *ngIf="state.status === 'empty'" class="cr-list__empty">No change requests to show.</p>

	<p
		*ngIf="state.status === 'loaded' && visibleRows.length === 0"
		class="cr-list__no-matches"
		role="status"
	>
		No change requests match the selected status.
	</p>

	<div *ngIf="state.status === 'loaded' && visibleRows.length > 0" class="cr-table-scroll">
		<table class="cr-list__table">
			<thead>
				<tr>
					<th scope="col">ID</th>
					<th scope="col">Title</th>
					<th scope="col">Status</th>
					<th scope="col">Delta</th>
				</tr>
			</thead>
			<tbody>
				<tr
					*ngFor="let cr of visibleRows"
					class="cr-list__row"
					[class.cr-list__row--selected]="cr.id === selectedId"
					(click)="onRowActivate(cr.id)"
				>
					<td>
						<button
							type="button"
							class="cr-list__select-btn"
							[attr.aria-current]="cr.id === selectedId ? 'true' : null"
							[attr.aria-label]="'Open change request ' + cr.id + ', ' + cr.title"
							(click)="$event.stopPropagation(); onRowActivate(cr.id)"
						>
							{{ cr.id }}
						</button>
					</td>
					<td class="cr-list__title">{{ cr.title }}</td>
					<td><span class="cr-status" [attr.data-status]="cr.status">{{ cr.status }}</span></td>
					<td class="cr-list__delta">{{ fmtDelta(cr) }}</td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
